name: Feature request
description: Something LakehouseBox does not do yet that you need.
labels: ["request"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The job, not only the feature. What would you do with it?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
      description: A command, an API call, a screen. Optional.
